<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <title>Serenity Attendance</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:rgba(0,0,0,0)}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#fff;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px}
    .screen{display:none;width:100%;max-width:360px;text-align:center;flex-direction:column;align-items:center;gap:14px}
    .screen.active{display:flex}
    .brand{font-size:11px;font-weight:700;letter-spacing:3px;color:#f59e0b}
    .title{font-size:22px;font-weight:700}
    .sub{font-size:13px;color:#94a3b8}
    .em{font-size:64px;line-height:1}
    .err-box{background:rgba(127,29,29,.5);border:1px solid #7f1d1d;border-radius:12px;padding:12px;font-size:13px;color:#fca5a5;text-align:left;width:100%;white-space:pre-line}
    .btn{background:#10b981;color:#0f172a;border:none;border-radius:12px;font-size:16px;font-weight:700;padding:15px;width:100%;cursor:pointer}
    .btn:active{background:#059669}
    .btn-ghost{background:transparent;color:#64748b;border:none;font-size:13px;cursor:pointer;padding:6px}
    .dots{display:flex;gap:10px;justify-content:center}
    .dot{width:16px;height:16px;border-radius:50%;border:2px solid #475569;background:transparent;transition:all .15s}
    .dot.on{background:#10b981;border-color:#10b981}
    .pin-msg{font-size:13px;min-height:18px;color:#ef4444}
    .np{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%}
    .nk{background:#1e293b;border-radius:12px;color:#fff;font-size:24px;font-weight:600;height:68px;cursor:pointer;display:flex;align-items:center;justify-content:center;-webkit-user-select:none;user-select:none;touch-action:manipulation;border:none;outline:none;}
    .nk:active,.nk:focus{background:#334155}
    .nk.del{background:#0f172a;color:#94a3b8;font-size:20px}
    .nk.empty{background:transparent;pointer-events:none}
    .nk.ok{background:#10b981;color:#0f172a;font-size:26px;font-weight:900}
    .nk.ok:disabled{background:#1e293b;color:#334155;cursor:default}
    .ab{border:none;border-radius:16px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;padding:18px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;touch-action:manipulation;width:100%}
    .ab:active{opacity:.75}
    .ab .ei{font-size:30px}
    .sc{background:#1e293b;border-radius:14px;padding:18px;width:100%;display:flex;flex-direction:column;gap:5px}
    .sn{font-size:24px;font-weight:700}
    .st{font-size:36px;font-weight:700;color:#10b981;font-variant-numeric:tabular-nums}
    .brow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .badge{font-size:11px;color:#10b981;font-weight:600}
    .note{font-size:12px;color:#475569}
    .spin{width:50px;height:50px;border-radius:50%;border:4px solid #1e293b;border-top-color:#10b981;animation:sp .8s linear infinite}
    @keyframes sp{to{transform:rotate(360deg)}}
    #qv{width:260px;height:260px;object-fit:cover;border-radius:14px;border:3px solid #10b981}
    .sf{position:relative;width:260px;height:260px}
    .cn{position:absolute;width:26px;height:26px;border-color:#10b981;border-style:solid}
    .cn.tl{top:-2px;left:-2px;border-width:4px 0 0 4px;border-radius:6px 0 0 0}
    .cn.tr{top:-2px;right:-2px;border-width:4px 4px 0 0;border-radius:0 6px 0 0}
    .cn.bl{bottom:-2px;left:-2px;border-width:0 0 4px 4px;border-radius:0 0 0 6px}
    .cn.br{bottom:-2px;right:-2px;border-width:0 4px 4px 0;border-radius:0 0 6px 0}
  </style>
</head>
<body>

<!-- QR Scan — always first screen -->
<div id="sq" class="screen active">
  <p class="brand">SERENITY HMS</p>
  <p class="title">Scan QR Code</p>
  <p class="sub">Point your camera at the entrance QR board</p>
  <div class="sf">
    <video id="qv" autoplay playsinline muted></video>
    <canvas id="qc" style="display:none"></canvas>
    <div class="cn tl"></div><div class="cn tr"></div>
    <div class="cn bl"></div><div class="cn br"></div>
  </div>
  <p class="note" id="scan-status">Starting camera…</p>
</div>

<!-- PIN -->
<div id="sp" class="screen">
  <p class="brand">SERENITY HMS</p>
  <p class="title">Enter your PIN</p>
  <p class="sub">Your 4–6 digit PIN</p>
  <div class="dots">
    <div class="dot" id="d0"></div><div class="dot" id="d1"></div>
    <div class="dot" id="d2"></div><div class="dot" id="d3"></div>
    <div class="dot" id="d4"></div><div class="dot" id="d5"></div>
  </div>
  <p class="pin-msg" id="pe"></p>
  <div class="np">
    <button class="nk" onclick="pk('1')">1</button>
    <button class="nk" onclick="pk('2')">2</button>
    <button class="nk" onclick="pk('3')">3</button>
    <button class="nk" onclick="pk('4')">4</button>
    <button class="nk" onclick="pk('5')">5</button>
    <button class="nk" onclick="pk('6')">6</button>
    <button class="nk" onclick="pk('7')">7</button>
    <button class="nk" onclick="pk('8')">8</button>
    <button class="nk" onclick="pk('9')">9</button>
    <button class="nk del" onclick="pk('X')">⌫</button>
    <button class="nk" onclick="pk('0')">0</button>
    <button class="nk ok" id="pin-ok" onclick="submitPin()" disabled>✓</button>
  </div>
</div>

<!-- Action -->
<div id="sa" class="screen">
  <p class="brand">SERENITY HMS</p>
  <p class="title" id="at"></p>
  <p class="sub" id="as"></p>
  <div id="ag" style="width:100%"></div>
</div>

<!-- Submitting -->
<div id="sbt" class="screen">
  <div class="spin"></div>
  <p class="sub" style="margin-top:12px" id="sbt-msg">Recording attendance…</p>
</div>

<!-- Success -->
<div id="ss" class="screen">
  <p class="em" id="sei">✅</p>
  <p class="sn" id="sal">Clocked In</p>
  <p class="st" id="stm">08:02</p>
  <div class="sc">
    <p class="sn" id="snm"></p>
    <p class="sub" id="sdt"></p>
    <div class="brow"><span class="badge">✅ QR scanned</span><span class="badge">✅ PIN verified</span></div>
  </div>
  <p class="note" style="color:#10b981">Thank you! Have a great shift 👍</p>
  <p class="note" id="scd">Closing in 5 seconds…</p>
</div>

<!-- Error -->
<div id="ser" class="screen">
  <p class="em">❌</p>
  <p class="title">Failed</p>
  <div class="err-box" id="erm"></div>
  <button class="btn" onclick="restart()">Try again</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script src="capacitor.js"></script>
<script>
const API='https://serenity-hms.vercel.app';

// State — NO localStorage, fresh every time
let qrToken='', pin='', gps=null, vs=null, sl=null;

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

// ── Start: always scan QR first ───────────────────────────────────────────────
window.onload = () => startQr();

// ── QR Scan ───────────────────────────────────────────────────────────────────
async function startQr(){
  qrToken=''; // clear any previous token — always fresh scan
  show('sq');
  document.getElementById('scan-status').textContent='Starting camera…';
  try{
    vs=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment',width:{ideal:1280}}});
    const v=document.getElementById('qv');
    v.srcObject=vs; await v.play();
    document.getElementById('scan-status').textContent='Point at the QR board';
    qrLoop();
  } catch(e){
    document.getElementById('scan-status').textContent='Camera error: '+(e.message||e);
  }
}

function qrLoop(){
  const v=document.getElementById('qv'),c=document.getElementById('qc'),ctx=c.getContext('2d');
  sl=requestAnimationFrame(()=>{
    if(!vs){return;}
    if(v.readyState===v.HAVE_ENOUGH_DATA){
      c.width=v.videoWidth;c.height=v.videoHeight;
      ctx.drawImage(v,0,0);
      const img=ctx.getImageData(0,0,c.width,c.height);
      if(window.jsQR){
        const code=jsQR(img.data,img.width,img.height);
        if(code&&code.data){
          stopCam();
          // Extract token
          let t=code.data;
          try{const u=new URL(code.data);t=u.searchParams.get('qr')||code.data;}catch{}
          qrToken=t;
          // Get GPS silently (non-blocking) then show PIN
          getGpsSilent().then(()=>{
            pin='';for(let i=0;i<6;i++)document.getElementById('d'+i).classList.remove('on');
            document.getElementById('pe').textContent='';
            show('sp');
          });
          return;
        }
      }
    }
    qrLoop();
  });
}

function stopCam(){
  if(sl)cancelAnimationFrame(sl);sl=null;
  if(vs){vs.getTracks().forEach(t=>t.stop());vs=null;}
}

// ── GPS — silent, non-blocking ────────────────────────────────────────────────
// GPS is collected for logging only — does NOT block the flow
async function getGpsSilent(){
  return new Promise((resolve)=>{
    const done=(coords)=>{
      if(coords) gps={lat:coords.latitude,lng:coords.longitude,acc:Math.round(coords.accuracy)};
      resolve();
    };
    try{
      if(window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.Geolocation){
        window.Capacitor.Plugins.Geolocation.requestPermissions()
          .then(()=>window.Capacitor.Plugins.Geolocation.getCurrentPosition({enableHighAccuracy:true,timeout:5000}))
          .then(p=>done(p.coords))
          .catch(()=>done(null));
      } else if(navigator.geolocation){
        navigator.geolocation.getCurrentPosition(p=>done(p.coords),()=>done(null),{enableHighAccuracy:true,timeout:5000,maximumAge:0});
      } else { done(null); }
    } catch{ done(null); }
  });
}

// ── PIN ───────────────────────────────────────────────────────────────────────
function pk(k){
  if(k==='X'){
    pin=pin.slice(0,-1);
  } else if(pin.length<6){
    pin+=k;
  }
  // Update dots
  for(let i=0;i<6;i++) document.getElementById('d'+i).classList.toggle('on',i<pin.length);
  document.getElementById('pe').textContent='';
  // Enable ✓ button only when 4+ digits entered
  const okBtn=document.getElementById('pin-ok');
  if(pin.length>=4){
    okBtn.disabled=false;
  } else {
    okBtn.disabled=true;
  }
}

async function submitPin(){
  if(pin.length<4) return;
  document.getElementById('pin-ok').disabled=true;
  show('sbt');document.getElementById('sbt-msg').textContent='Checking…';
  try{
    const r=await fetch(`${API}/api/public/qr-attendance/pin-clock`,{
      method:'POST',headers:{'Content-Type':'application/json'},mode:'cors',
      body:JSON.stringify({propertyQrToken:qrToken,pin,action:'GET_STATE',gpsLat:gps?.lat,gpsLng:gps?.lng,gpsAccuracyM:gps?.acc})
    });
    const j=await r.json();const d=j.data||j;
    if(!r.ok){
      if(r.status===401){
        document.getElementById('pe').textContent='❌ Incorrect PIN. Try again.';
        pin='';for(let i=0;i<6;i++)document.getElementById('d'+i).classList.remove('on');
        document.getElementById('pin-ok').disabled=true;
        show('sp');
      } else {
        document.getElementById('erm').textContent=d.error||'Error. Try again.';show('ser');
      }
      return;
    }
    showAction(d.nextAction,d.employeeName,d.designation);
  } catch(e){
    document.getElementById('erm').textContent='Cannot connect to server.\n\nError: '+(e.message||e);show('ser');
  }
}

// ── Action button ─────────────────────────────────────────────────────────────
function showAction(nextAction,name,designation){
  const cfg={
    CLOCK_IN:   {emoji:'✅',label:'Clock In',   color:'#10b981'},
    BREAK_START:{emoji:'☕',label:'Take Break', color:'#f59e0b'},
    BREAK_END:  {emoji:'🔙',label:'Resume Work',color:'#3b82f6'},
    DONE:       {emoji:'🌙',label:'Shift Done', color:'#64748b'},
  };
  const c=cfg[nextAction]||cfg.CLOCK_IN;
  const ag=document.getElementById('ag');
  document.getElementById('at').textContent='';
  document.getElementById('as').textContent='';
  if(nextAction==='DONE'){
    ag.innerHTML=`<div style="text-align:center;padding:20px"><p style="font-size:48px">🌙</p><p style="font-size:18px;font-weight:700;margin:8px 0">Shift complete!</p><p style="color:#94a3b8;font-size:13px">See you tomorrow.</p></div>`;
    setTimeout(()=>restart(),4000);
  } else {
    ag.innerHTML=`
      <p style="font-size:14px;color:#94a3b8;margin-bottom:8px">Welcome, <strong style="color:#fff">${name}</strong></p>
      <p style="font-size:12px;color:#64748b;margin-bottom:14px">${designation}</p>
      <button class="ab" style="min-height:110px;font-size:22px;background:${c.color}" onclick="sub('${nextAction}')">
        <span class="ei" style="font-size:52px">${c.emoji}</span>${c.label}
      </button>`;
  }
  show('sa');
}

// ── Submit ────────────────────────────────────────────────────────────────────
async function sub(action){
  show('sbt');document.getElementById('sbt-msg').textContent='Recording attendance…';
  try{
    const r=await fetch(`${API}/api/public/qr-attendance/pin-clock`,{
      method:'POST',headers:{'Content-Type':'application/json'},mode:'cors',
      body:JSON.stringify({propertyQrToken:qrToken,pin,action,gpsLat:gps?.lat,gpsLng:gps?.lng,gpsAccuracyM:gps?.acc})
    });
    const j=await r.json();const d=j.data||j;
    if(!r.ok){
      if(r.status===401){
        document.getElementById('pe').textContent='❌ Incorrect PIN. Try again.';
        pin='';for(let i=0;i<6;i++)document.getElementById('d'+i).classList.remove('on');
        show('sp');
      } else {
        document.getElementById('erm').textContent=d.error||'Something went wrong.';show('ser');
      }
      return;
    }
    const ei={CLOCK_IN:'✅',BREAK_START:'☕',BREAK_END:'🔙',CLOCK_OUT:'👋'};
    const lb={CLOCK_IN:'Clocked In',BREAK_START:'Break Started',BREAK_END:'Break Ended',CLOCK_OUT:'Clocked Out'};
    document.getElementById('sei').textContent=ei[action]||'✅';
    document.getElementById('sal').textContent=d.actionLabel||lb[action];
    document.getElementById('stm').textContent=new Date(d.time).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
    document.getElementById('snm').textContent=d.employeeName||'';
    document.getElementById('sdt').textContent=(d.designation||'')+(d.department?' · '+d.department:'');
    show('ss');
    if(d.autoClockOut){
      document.getElementById('scd').textContent='🌙 Shift complete! Rest well.';
      setTimeout(()=>restart(),5000);
    } else {
      let s=5;const t=setInterval(()=>{s--;document.getElementById('scd').textContent=`Closing in ${s}s…`;if(s<=0){clearInterval(t);restart();}},1000);
    }
  } catch(e){
    document.getElementById('erm').textContent='Cannot connect to server.\n\nError: '+(e.message||e);show('ser');
  }
}

function restart(){
  pin='';qrToken='';gps=null;
  for(let i=0;i<6;i++)document.getElementById('d'+i).classList.remove('on');
  document.getElementById('pe').textContent='';
  document.getElementById('pin-ok').disabled=true;
  stopCam();
  startQr(); // Always go back to QR scan
}
</script>
</body>
</html>
